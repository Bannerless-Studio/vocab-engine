<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocab trainer</title>
<!-- Browsers request /favicon.ico by default when no icon link exists; GitHub Pages 404s
     that on every load. This data URI (a plain book glyph, no brand) stops the request. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%231B2321' d='M2 2.5A1.5 1.5 0 0 1 3.5 1H8v14H3.5A1.5 1.5 0 0 1 2 13.5v-11ZM13 1H8.5v14H13a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 13 1Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Non-blocking font CSS: first paint never waits on fonts.googleapis.com (system fonts
     until it lands; display=swap then swaps the webfont in). -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
  :root{
    --bg:#EEF0ED;--ink:#1B2321;--mute:#5C6B67;--line:#D6DAD7;--card:#FFFFFF;
    --ok:#2F7A5B;--ok-bg:#E4F1EB;--bad:#B4483F;--bad-bg:#FBEAE8;
    --font: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    /* Target-language text: the UI font first, then system fonts that cover non-Latin
       scripts (IBM Plex lacks many glyphs; missing ones fall through to system fonts). */
    --wbase: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    /* pack.fontFamily, when set, is prepended at boot: --wfont = <pack font>, var(--wbase)
       (pack.rtl: its named families only, generic keywords such as serif dropped). */
    --wfont: var(--wbase);
    --safe-b: env(safe-area-inset-bottom, 0px);
    /* The fixed tab bar's real height: 56px buttons (fixed, see .tabs) + 1px top border,
       plus the safe area. Content clears it by --tabbar-gap: body padding sets the scroll
       end, html scroll-padding keeps scrollIntoView (showNext) targets above the bar. */
    --tabbar-h: calc(57px + var(--safe-b));
    --tabbar-gap: 8px;
    --t1:#3B6E99;--t2:#35784F;--t3:#8E622A;--t4:#B33F3F;--t5:#706A61;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
      --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
      --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
    --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
    --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
  html{scroll-padding-bottom:calc(var(--tabbar-h) + var(--tabbar-gap))}
  body{padding-bottom:calc(var(--tabbar-h) + var(--tabbar-gap))}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 24px;min-height:calc(100dvh - var(--tabbar-h) - var(--tabbar-gap));display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex:0 0 auto}
  h1{font-size:18px;font-weight:600;margin:0}
  .score{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hdrbar{height:3px;border-radius:2px;background:transparent;margin-bottom:12px;flex:0 0 auto;overflow:hidden}
  .hdrbar i{display:block;height:100%;width:0;background:var(--ink);transition:width 0.2s ease}
  @media (prefers-reduced-motion: reduce){ .hdrbar i{transition:none} }
  .themebtn{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:16px;color:var(--ink);flex:0 0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;flex:1 1 auto;display:flex;flex-direction:column}
  #panel > .done{display:flex;flex-direction:column;flex:1 1 auto}
  .next:last-child, .primary:last-child, .done .next{margin-top:auto}
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .drill-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
  /* Drill items centre in the tall card; dashboards (Today) read top-down, so they don't. */
  .drill-body.top{justify-content:flex-start}
  .q{color:var(--mute);font-size:15px;margin:0 0 10px}
  .q.cue{color:var(--ink);font-size:17px;margin:4px 0 14px}
  .big{font-size:52px;line-height:1.3;text-align:center;margin:6px 0 16px;font-weight:500;overflow-wrap:anywhere}
  .med{font-size:22px;line-height:1.5;margin:2px 0 14px}
  .wd{font-family:var(--wfont)}
  .pron{color:var(--mute);font-size:18px;text-align:center;margin:-10px 0 14px}
  .en{color:var(--mute);font-size:15px;text-align:center;margin-top:-8px;margin-bottom:14px}
  .blank{color:var(--mute);letter-spacing:1px;unicode-bidi:isolate}
  /* Target-language text carries data-tl + lang (+ dir="rtl" for pack.rtl); block
     elements then align to their start side. English glosses never carry it. */
  [data-tl]{font-family:var(--wfont)}
  :root[data-tlh] [data-tl]{line-height:var(--tlh)}
  /* pack.rtl (docs/PACK_SCHEMA.md "RTL rendering"): target text and UI/English text never
     share a bidi context. UI lines nested in a target-language block carry dir=ltr +
     data-ui (UIA): their own isolated LTR context, in the UI font. Target-language
     fragments inside UI text (ui(), tf()) are <bdi data-tl lang dir=rtl class=tlf>: the
     pack font, with the pack line-height capped so a tall script (Nastaliq 2.6) does
     not grow the UI line it sits in. */
  [data-ui]{font-family:var(--font);unicode-bidi:isolate}
  [dir=rtl] [data-ui]{text-align:right} /* still aligned to the RTL block's start edge */
  :root[data-tlrtl] input[data-tl]::placeholder{font-family:var(--font)} /* English placeholder, UI font */
  :root[data-tlrtl] .gloss{text-align:right} /* the LTR popover line sits on the RTL block's edge */
  :root[data-tlh] [data-tl].tlf{line-height:1}
  /* Korean only: words (Hangul syllable blocks) are space-separated like Latin, so the
     default break-anywhere wrapping can split inside a word (봤어/요). Scoped off the
     lang attribute TA already sets from pack.langTag, not a global rule: languages with
     no spaces between words, e.g. zh, ja, must keep normal, break-anywhere wrapping. */
  [data-tl][lang|="ko"]{word-break:keep-all}
  /* minmax(0,1fr): the track never grows past the card for a long unbreakable word. */
  .opts{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .opts button{width:100%;min-width:0;overflow-wrap:anywhere;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:17px;color:var(--ink);line-height:1.35;min-height:48px;font-family:var(--font)}
  .opts button b.num{color:var(--mute);font-weight:500;margin-inline-end:8px;font-size:14px}
  /* inline-block: the pron stays beside a short word and drops whole onto its own line
     under a long one (профессиональный + its pron at 360px) instead of overflowing. */
  .opts button .op{display:inline-block;max-width:100%;color:var(--mute);font-size:14px;font-weight:400;margin-inline-start:8px}
  .opts button[dir=rtl]{text-align:right}
  /* .num and .op carry UIA (dir=ltr data-ui, docs/PACK_SCHEMA.md "RTL rendering"), so
     their own margin-inline-* resolves against their OWN ltr direction, not the RTL
     button's. In an RTL button the number sits first (rightmost) with the word to its
     left, and the pron span sits after the word (further left, word to ITS right): both
     gaps are on each element's physical-left/right, the opposite of the ltr case, so the
     inline-end/inline-start pair flips here rather than moving to a flex gap (the button
     is a plain wrapping text run, not a flex row, and .opts uses grid for the button
     list itself — restructuring it to flex would change dist bytes for every pack). */
  .opts button[dir=rtl] b.num{margin-inline-end:0;margin-inline-start:8px}
  .opts button[dir=rtl] .op{margin-inline-start:0;margin-inline-end:8px}
  .opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  .opts-hero button{font-size:18px;padding:18px 18px;min-height:58px;font-weight:500}
  .opts-w button{font-family:var(--wfont)}
  .opts-w button b.num{font-family:var(--font)}
  .hear-stage{display:flex;justify-content:center;margin:14px 0 22px}
  .speaker{width:92px;height:92px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:36px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  @keyframes speakerPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .speaker.speaking,.replay.speaking{animation:speakerPulse 0.9s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .speaker.speaking,.replay.speaking{animation:none} }
  .rvsay{display:flex;justify-content:center;margin:10px 0 0}
  .reveal{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:none;font-size:15px}
  .reveal .rw{font-size:22px;margin-bottom:2px;font-family:var(--wfont)}
  .reveal .rp{color:var(--mute);margin-bottom:2px}
  /* pack.rtl: an answer block (the reveal, and the same block in the Missed list) aligns
     to one edge, the right: target lines are dir=rtl (start = right) and the Latin pron,
     gloss and labels keep their LTR direction but share the right edge. */
  :root[data-tlrtl] .reveal,:root[data-tlrtl] .rvb{text-align:right}
  .next,.primary{margin-top:14px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;min-height:48px;font-family:var(--font)}
  .ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;min-height:44px;font-family:var(--font)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .row button, .chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;color:var(--ink);min-height:44px;font-family:var(--font)}
  .row button.on, .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .replay{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:17px;color:var(--ink);flex:0 0 auto}
  .ktag{text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
  .ktag b{font-weight:600;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .dim{opacity:.6} /* pack.glossFocus: a gloss's (...) qualifiers */
  .listen-stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0}
  input[type=text]{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;font-size:19px;background:var(--card);color:var(--ink);font-family:var(--wfont)}
  input[type=text]:focus{outline:3px solid #7AA7D9;outline-offset:1px}
  .diff{font-size:15px;margin-top:6px}
  .wl{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:flex-start;gap:12px}
  .wl .wd{font-size:22px;flex:0 1 auto;min-width:64px;max-width:48%;overflow-wrap:anywhere}
  .wl .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .wl .pr{font-size:15px;display:block}
  .wl .en{color:var(--mute);font-size:14px;text-align:left;display:block;margin:0}
  table.stats{width:100%;border-collapse:collapse;font-size:15px}
  table.stats td{padding:8px 0;border-bottom:1px solid var(--line)}
  table.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  /* Today step names never wrap ("5. Sentences" at 390px); the description column wraps. */
  table.steps td:first-child{white-space:nowrap;padding-right:12px;vertical-align:top}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--ink)}
  /* Stage path: one line per label, bars on one top line. A segment is as wide as its label
     plus an equal share of the rest (flex 1 1 auto), so a long script-stage label stays whole
     beside A1; labels only ellipsize when the whole strip cannot fit. flex-start: a taller
     label line (a target-script font) never moves its bar. */
  .path{display:flex;gap:6px;align-items:flex-start;margin-bottom:14px}
  .path .seg{flex:1 1 auto;min-width:0;text-align:center;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stmt{font-size:15px;line-height:1.5;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .warn{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .done h2{font-size:22px;margin:0 0 10px;font-weight:600}
  .done ul{padding-left:20px;font-size:15px;margin:8px 0}
  .card-teach{margin-bottom:14px}
  .card-teach h3{font-size:17px;margin:0 0 8px;font-weight:600}
  .card-teach p{font-size:15px;color:var(--mute);margin:0 0 10px}
  .rowset{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
  .rowset .wd{font-size:18px;flex:0 1 auto;min-width:52px;max-width:45%;overflow-wrap:anywhere}
  .rowset .pr{flex:1;min-width:0;color:var(--mute);font-size:15px;overflow-wrap:anywhere}
  .rowset .en{color:var(--mute);font-size:14px;text-align:right;flex:0 1 auto;min-width:0;margin:0;overflow-wrap:anywhere}
  .rowset .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .rowset .info .pr{flex:0 0 auto;display:block;overflow-wrap:anywhere}
  .rowset .info .en{text-align:left;display:block}
  /* Characters stage (pack.characters): Learn teach cards, and sentence ruby by tier.
     A sentence carrying ruby gets a fixed tall line box, so lines with and without a
     ruby token are the same height (no jump as tokens change tier) and wrapped lines
     never collide with the reading above them. */
  .charteach{padding:10px 0;border-bottom:1px solid var(--line)}
  .charteach .chead{display:flex;align-items:center;gap:14px}
  .charteach .cform{font-size:40px;line-height:1.2;flex:0 1 auto;min-width:56px;max-width:55%;text-align:center;overflow-wrap:anywhere}
  .charteach .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .charteach .pr{font-size:16px}
  .charteach .en{color:var(--mute);font-size:14px;text-align:left;margin:0}
  .charteach .sent{border-bottom:none;padding:4px 0 0;font-size:14px}
  .chint{display:block;color:var(--mute);font-size:13px;line-height:1.35}
  .chint>span{display:block}
  .chint .hc{font-size:15px}
  .big.xg{font-size:64px;line-height:1.2}
  .opts-g{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts-g button{text-align:center;font-size:28px;line-height:1.3}
  .xteach{padding:10px 0;border-bottom:1px solid var(--line)}
  .xhead{display:flex;align-items:center;gap:14px}
  .xhead .cform{font-size:64px;line-height:1.15;flex:0 1 auto;min-width:64px;max-width:50%;text-align:center;overflow-wrap:anywhere}
  .xhead .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .xhead .en{color:var(--mute);font-size:14px;text-align:left;margin:0;overflow-wrap:anywhere}
  .xnm{font-size:15px}
  .xrm{font-weight:700;font-size:17px;overflow-wrap:anywhere}
  .xrow2 .xrm{font-size:15px;color:var(--mute);font-weight:400}
  .xrow2{font-size:24px;line-height:1.5;margin:8px 0 2px;overflow-wrap:anywhere}
  .xit{font-style:italic;font-size:30px;margin-inline-start:8px}
  .xforms{display:flex;gap:6px;margin:8px 0 2px}
  .xfc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 2px}
  .xff{font-size:32px;line-height:1.5}
  .xfl{font-size:11px;color:var(--mute)}
  /* Spread shadow widens the tint past a thin joined letter (fa medial ا, ی) without
     padding: padding/border on an inline breaks Arabic-script shaping across it. */
  .xhl{background:var(--ok-bg);border-radius:3px;box-shadow:0 0 0 2px var(--ok-bg)}
  /* ::highlight() takes no box-shadow/border-radius, so the span's spread (which keeps a
     thin joined letter, medial ا or initial ل, visible) is replaced by tinting the glyph
     itself: the letter turns --ok on the --ok-bg ground, visible at any width. */
  ::highlight(xhl){background-color:var(--ok-bg);color:var(--ok)}
  .xrword{margin-top:8px}
  .xset{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
  .xsn{color:var(--mute);font-size:12px;min-width:14px;padding-top:12px;text-align:right}
  .xcells{flex:1;min-width:0}
  .xcells button{display:flex;flex-direction:column;align-items:center;min-width:48px;min-height:48px;padding:4px 8px}
  .xcg{font-size:20px;line-height:1.2}
  .xcr{font-size:11px;color:var(--mute)}
  .xcells button.xt,.xkey.xt{border-color:var(--ink)}
  .xcells button.xm,.xkey.xm{border-color:var(--ok);background:var(--ok-bg)}
  .xkey{display:inline-block;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  #xcard .xteach{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:var(--card);scroll-margin-top:12px}
  .hasruby{line-height:2.3}
  .showw{display:inline-block;width:auto;min-height:0;margin:0 0 0 6px;padding:2px 6px;border:0;background:none;color:var(--mute);font:400 12px/1.2 var(--font);text-decoration:underline;vertical-align:middle;cursor:pointer}
  .wwr{color:var(--mute);font-size:.8em;margin-inline-start:3px}
  .showw,.wwr{white-space:nowrap}
  /* A row word shown by its reading (class pf) keeps reading and tap on one line: the
     word column may take up to 75% (a reading has no break points), the gloss column
     shrinks and wraps instead. Readings stay short (zh max 13 letters, 公共汽车). */
  .wl .wd.pf,.rowset .wd.pf{white-space:nowrap;max-width:75%}
  .psent .ptxt.hasruby{line-height:2.3}
  .hasruby ruby{ruby-position:over}
  .hasruby rt{font-family:var(--font);font-size:0.5em;line-height:1;color:var(--mute);font-weight:400}
  .hasruby ruby.bare rt{visibility:hidden}
  .sent{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .sent .st{font-family:var(--wfont);font-size:17px}
  .sent .sp{color:var(--mute);font-size:14px}
  .sent .se{color:var(--mute);font-size:14px}
  .taplist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .taplist button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:15px;min-height:48px;font-family:var(--wfont)}
  .plist button{display:flex;justify-content:space-between;width:100%;text-align:start;padding:13px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;font-size:16px;color:var(--ink);min-height:48px;align-items:center}
  .plist .tick{color:var(--ok);font-size:14px}
  .rlv{margin-bottom:14px}
  .rlh{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:16px;margin-bottom:4px}
  .ptitle{font-size:21px;margin:0 0 4px;font-weight:600}
  .passage{margin:4px 0 8px}
  .passage[hidden],.gloss[hidden],[hidden].q{display:none}
  .psent{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 8px;padding:8px 6px;border-radius:10px}
  .psent.hi{background:var(--ok-bg)}
  .psent .ptxt{flex:1 1 0;min-width:0;font-size:19px;line-height:1.7;overflow-wrap:anywhere}
  .psent .psay{width:36px;height:36px;font-size:14px}
  .psent .lsay{text-align:start;min-height:40px;padding:8px 12px}
  .psent .lsay.speaking{border-color:var(--ink)}
  .pchips{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:6px}
  .pw{border-bottom:1px dotted var(--mute);cursor:pointer}
  .pw.on{background:var(--ok-bg);border-bottom-color:var(--ok)}
  .pchip{font-size:14px;padding:2px 8px;border:1px solid var(--line);border-radius:8px;border-bottom-style:solid}
  /* A floating card: kept a row clear of the top edge (and the phone's status area, safe-area
     inset) so it is never clipped, with a --mute border and a shadow so it never blends into
     the sentence rows (owner report 2026-09-30). */

<!-- PACK-BEGIN: dev-mode pack loader. build.sh replaces everything up to PACK-END with

     (the last four are optional; a 404 for a missing one is harmless, see below). Dev usage from file://:
     engine/app.html?pack=zh  (loads ../packs/zh/)  or  ?packdir=../../pack -->
<script>
(function(){
  var q = location.search;
  var dm = /[?&]packdir=([A-Za-z0-9_.\/-]+)/.exec(q), pm = /[?&]pack=([A-Za-z0-9_-]+)/.exec(q);
  var dir = dm ? dm[1] : "../packs/" + (pm ? pm[1] : "zh");
  ["pack","words","sentences","lessons","characters","script","legacy"].forEach(function(f){ document.write('<script src="' + dir + '/' + f + '.js"><\/script>'); });
})();
</script>
<!-- PACK-END -->
<script src="core.js"></script>
<script>

const LEVELS = VC.levelIds(PACK);
const SIZE = VC.setSizeOf(PACK);
const BY_LV = VC.wordsByLevel(WORDS, PACK);
const WORDS_BY_ID = {}; WORDS.forEach(w=>{ WORDS_BY_ID[w.id] = w; });

// Every primer surface is gated on HAS_SCRIPT (docs/SCRIPT_PRIMER.md); without it each code

const SCRIPT_DATA = (typeof SCRIPT !== "undefined" && SCRIPT && typeof SCRIPT === "object" && Array.isArray(SCRIPT.units)) ? SCRIPT : null;

const SCFG = HAS_SCRIPT ? VC.scriptConfig(PACK) : null;
// pack.script without its data (no script.js, or no units): the primer is off everywhere

const SUNITS = HAS_SCRIPT ? SCRIPT_DATA.units : [];

const SU = HAS_SCRIPT ? SUNITS : undefined;
const SUNIT_BY_ID = {}; SUNITS.forEach(u => { if(u && u.id) SUNIT_BY_ID[u.id] = u; });

// asks for a symbol it does not teach. A Latin `pron` (fa) never replaces the word.
const SCRIPT_BYID = (() => {
  if(!HAS_SCRIPT) return WORDS_BY_ID;
  const fold = s => String(s || "").normalize("NFKD").toLowerCase();
  const inv = new Set();
  SUNITS.forEach(u => { [String(u.t || ""), ...(Array.isArray(u.syll) ? u.syll.map(s => String((s && s.t) || "")) : [])].forEach(t => [...fold(t)].forEach(ch => { if(/\p{L}/u.test(ch)) inv.add(ch); })); });
  const letters = s => [...fold(s)].filter(ch => /\p{L}/u.test(ch));
  const inScript = s => { const l = letters(s); return l.length > 0 && l.every(ch => inv.has(ch)); };

const LEGACY_MAP = (typeof LEGACY !== "undefined" && LEGACY && typeof LEGACY === "object") ? LEGACY : null;
const HAS_LEGACY = !!(PACK.legacy && typeof PACK.legacy === "object" && typeof PACK.legacy.key === "string" && PACK.legacy.key) && !!LEGACY_MAP;
const SENT_INDEX = new Map(SENTENCES.map((s,i)=>[s, i]));

const levelLabel = lv => VC.levelLabel(PACK, lv);
document.title = PACK.name;
// tw() wraps inline target text in an isolating <bdi> so it never reorders the English or

const DISP = VC.scriptDisplay(PACK);
const TA = ` data-tl lang="${escapeHtml(DISP.lang)}"${DISP.rtl ? ' dir="rtl"' : ""}`;

const STORE_KEY = VC.storageKey(PACK);
let prog = VC.defaultProg(PACK);

// "nothing stored": boot goes read-only so progress that merely failed to load is never
// overwritten. A write error never falls through to the other backend (that would split
// progress across two stores); it is surfaced instead.

  async getRaw(key){

  load(){ return this.getRaw(STORE_KEY); },

// reqKind: a pass on a fallback item (hear shown as read, type as recall) must still clear k.
function markWord(id, ok, kind, reqKind){ VC.ensureWordRec(prog, WORDS, PACK, id); VC.markRec(prog.w, id, ok, true, kind, reqKind); dayNote("w:" + id, kind, ok); store.save(); }
// Cloze: the sentence item keeps r/w/s; only the blanked word's missed kind changes.
function markGapWord(id, ok, kind){ const k = VC.markMissKind(prog.w, id, ok, kind); if(dayNote("w:" + id, "gap", ok) || k) store.save(); }

function markChar(unitId, ok, kind){
  const held = !!(TYPED_UNITS && TYPED_UNITS.has(unitId)), rec = VC.charRecs(prog)[unitId];
  const moves = !(held && rec && (rec.s || 0) >= CHAR_CFG.mastered);

  if(it) it.cueUnit = null;

  const u = VC.markUnitTyped(prog, CHAR_LIST, PACK, id, ok);

// docs/PACK_SCHEMA.md "dayAware": today's answers steer the day's later plans.
const DAY_AWARE = VC.dayAwareOn(PACK);
const dayToday = () => DAY_AWARE ? todayISO() : undefined;
const PLAN_ORDER = DAY_AWARE ? "misses and due first" : "weakest first";
// The kinds a word / sentence can be shown in on this device: planners never route a miss to a
// kind the item builder would swap out (no voice, no blank), and such a miss settles as
// core.js daySettles says.
let SENT_BY_ID_DAY = null;
// words[].pronInGloss: while such a word shows by its reading, recall (and a type slot no typed
// kind fits, which falls back to recall) is swapped for the read item (recallItem).
const pronLeakShown = w => !!(w && w.pronInGloss) && dispWord(w).isPron;
const dayWordCan = w => { const c = VC.dayWordCan(PACK, canHearWord)(w); return pronLeakShown(w) ? c.filter(k => k !== "recall" && (k !== "type" || typedFits(w))) : c; };

// shown by its reading is never blanked; a sentence with no other blank is not a gap item.
const gapIdxs = s => { const ix = VC.gapCandidateIndices(s, WORDS_BY_ID, PACK); return (s.words || []).some(id => pronLeakShown(WORDS_BY_ID[id])) ? ix.filter(i => !pronLeakShown(WORDS_BY_ID[s.words[i]])) : ix; };

const dayCanOf = key => {
  const k = String(key), id = k.slice(2);
  if(k[0] === "w") return WORDS_BY_ID[id] ? dayWordCan(WORDS_BY_ID[id]) : undefined;
  if(k[0] !== "s") return undefined;
  if(!SENT_BY_ID_DAY){ SENT_BY_ID_DAY = {}; SENTENCES.forEach(x => { SENT_BY_ID_DAY[x.id] = x; }); }

const dayNote = (key, kind, ok) => DAY_AWARE && VC.noteDay(prog, PACK, todayISO(), key, kind, ok, dayCanOf(key));

const samsungNoticeHTML = VC.isSamsungBrowser(navigator.userAgent)
  ? `<div class="warn">Audio doesn't play in Samsung Internet. Open this page in Chrome or Firefox to hear the words.</div>` : "";

const SS = window.speechSynthesis || null;
const speechAPI = !!(SS && window.SpeechSynthesisUtterance);
const TTS_LANG = String(PACK.tts || "en-US");
const TTS_RATE = PACK.ttsRate || 0.9;
let ttsVoice = null, noticeShown = false;
let hasSpeech = VC.speechUsable(speechAPI, [], TTS_LANG);

function stopSpeaking(){

  P.innerHTML = `<div class="drill-body"><p class="q">${ui(it.label)}</p>${noticeFor(it)}${it.html||""}
    <input type="text" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"${it.inputTA !== undefined ? it.inputTA : TA} placeholder="${escapeHtml(it.placeholder || (DISP.rtl ? "type the word" : "type the word…"))}">
    <div class="reveal" id="rv"></div></div><div class="actions"><button class="next" id="submit">Check</button><button class="next" id="nx" style="display:none">Next</button></div>`;
  if(it.mount) it.mount();
  const input = $("tin"); input.focus();
  let answered = false;
  function submit(){
    if(answered) return; if(!input.value.trim()) return;
    answered = true; input.disabled = true; $("submit").style.display = "none";
    const ok = it.check(input.value);
    D.seen++; if(ok) D.right++; else { D.miss.push(it); D.q.push(typedRequeue(it)); }
    if(it.onAnswer) it.onAnswer(ok);
    showReveal(revealHTML(it, (ok ? "" : `<div class="diff">you typed: ${escapeHtml(input.value)}</div>`) + (it.feedback ? it.feedback(input.value) : "") + (it.reveal||"")));
    playReveal(it);
    showNext(); setScore(D.seen, D.seen + D.q.length);
    D.cur = null; sessionSave(true);
  }
  $("submit").onclick = submit;
  $("nx").onclick = dnext;
  drillKeyHandler = e => {
    if(!D) return;
    if(e.key === "Enter"){ answered ? dnext() : submit(); }
    else if(e.key === "Escape"){
      if(document.activeElement === input){ input.blur(); return; }
      quitDrill();
    }
  };
}
// Keys on a show-written button are its own; they never reach the drill's shortcuts.
const onShowWritten = e => !!(e && e.target && e.target.closest && e.target.closest("[data-showw]"));
// Escape belongs to a word tap only when it closed something (tokEscEaten); otherwise it
// reaches the drill as usual (quit).
let tokEscEaten = null;
const tokOwns = e => onTok(e) && (e.key !== "Escape" || e === tokEscEaten);
// Only an Escape with nothing open reaches the drill (quit).
function dismissGlosses(){
  const P = $("panel"); if(!P) return false;
  const open = [$("gloss"), ...P.querySelectorAll(".gloss")].filter((g, i, a) => g && !g.hidden && a.indexOf(g) === i);
  const on = [...P.querySelectorAll(".pw.on, .tk.on")];
  open.forEach(g => { g.hidden = true; });
  on.forEach(x => x.classList.remove("on"));
  if(helpCur && !open.includes(helpCur.el) && helpCur.el.id === "audiohint"){ helpShut(); return true; }
  if(helpCur) helpShut();
  return open.length > 0 || on.length > 0;
}
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !tokOwns(e) && dismissGlosses()){ e.preventDefault(); return; }
  if(drillKeyHandler && !onShowWritten(e) && !tokOwns(e)) drillKeyHandler(e);
});
function quitDrill(){ sessionSave(); D = null; drillKeyHandler = null; rzFin = null; render(); }

// Word taps inside sentences: no progress effect, never inside answer buttons. A tap speaks
// the word only; the sentence is heard from its own speaker button. A multi-token word
// (PACK_SCHEMA.md spans: one span per surface token, के लिए as two) highlights every token so
// it reads as one unit.
function tokTapHTML(wordId, inner, head){
  const h = head ? ` data-ts="${escapeHtml(head.surface)}" data-tr="${escapeHtml(head.reading)}"` : "";
  return `<span class="tk" data-tok="${escapeHtml(wordId)}"${h} role="button" tabindex="0">${inner}</span>`;
}
// A token whose surface contains its word's written form and more (这个 for 这) heads the
// popover with that surface; a token covering only part of the word (ja ruby over the
// stem) keeps the word's own headword.
function phraseHead(surface, w, reading){
  const ww = String((w && w.w) || ""), t = String(surface || "");
  return ww && t !== ww && t.indexOf(ww) >= 0 ? { surface: t, reading: String(reading || "") } : null;
}
const sentSayHTML = s => canHearSentence(s) ? `<button type="button" class="replay ssay" data-sent="${SENT_INDEX.get(s)}" aria-label="Hear the sentence">${TEACH_PLAY_SVG}</button>` : "";
const tokHeadOf = t => t.dataset.ts !== undefined ? { surface: t.dataset.ts, reading: t.dataset.tr || "" } : null;
function tokTap(t){
  const w = WORDS_BY_ID[t.dataset.tok]; if(!w) return;
  const head = tokHeadOf(t);
  const html = glossHTML(w.id, "", head, true);
  const box = t.closest("[data-tokbox]");
  if(box){
    const g0 = box.querySelector(".tokgloss"); if(helpCur && helpCur.el !== g0) helpShut();
    box.querySelectorAll(".tk.on").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    box.querySelectorAll(".tk").forEach(x => { if(x !== t && x.dataset && x.dataset.tok === t.dataset.tok) x.classList.add("on"); });
    let g = box.querySelector(".tokgloss");
    if(!g){ g = document.createElement("div"); g.className = "gloss tokgloss"; if(DISP.rtl) g.setAttribute("dir", "ltr"); box.appendChild(g); } // an LTR box, as glossBox
    g.innerHTML = html + HELP_X; g.hidden = false;
    helpOpen(g, HELP_MS, () => { tokDismiss(t); });
    bringIntoView(g); // appended below the sentence: a tap on its last line can open it under the tab bar
  }
  announce(html);
  if(head && head.surface !== w.w) say(head.surface); else sayWord(w);
}
function tokDismiss(t){
  const box = t.closest("[data-tokbox]"); if(!box) return false;
  const on = box.querySelectorAll(".tk.on"); const g = box.querySelector(".tokgloss");
  const open = on.length > 0 || !!(g && !g.hidden);
  on.forEach(x => x.classList.remove("on"));
  if(g) g.hidden = true;
  return open;
}
const onTok = e => !!(e && e.target && e.target.closest && e.target.closest("[data-tok]"));

// Tap-to-hear for everything in #panel. INVARIANT: the only listener for these attributes,
// attached once here at load. #panel is persistent, so attaching per render would stack one
// more listener each time (N taps -> N sounds). Render code only emits the attributes.
$("panel").addEventListener("click", e => {
  const t = e.target.closest(HAS_SCRIPT ? "[data-tok],[data-sent],[data-wid],[data-xs],[data-xw]" : "[data-tok],[data-sent],[data-wid]");
  if(!t) return;
  if(t.dataset.tok !== undefined){ tokTap(t); return; }
  if(t.dataset.xs !== undefined){ const u = SUNIT_BY_ID[t.dataset.xs]; if(!u) return; if(t.dataset.xopen !== undefined) scriptOpenCard(u, e); sayUnitSound(u, t); return; }
  if(t.dataset.xw !== undefined){ const w = SCRIPT_BYID[t.dataset.xw]; if(w && (wordAudio(w) || scriptVoice())) sayWord(w); return; }
  if(t.dataset.wid !== undefined){ const w = WORDS_BY_ID[t.dataset.wid]; if(w) sayWord(w); return; }
  const s = SENTENCES[+t.dataset.sent]; if(s) saySentence(s);
});
// Attached once, here, like the above.
$("panel").addEventListener("keydown", e => {
  const t = e.target && e.target.closest ? e.target.closest("[data-tok]") : null;
  if(t && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); tokTap(t); }
  else if(t && e.key === "Escape" && tokDismiss(t)){ tokEscEaten = e; e.preventDefault(); } // consumed: the drill never sees it
});

// Capture phase, so it runs before (and stops) the row/tap-to-hear handlers it sits in.
// Focus moves to the revealed span (tabindex -1) so it never drops to body.
function revealWritten(b){
  const sp = document.createElement("span");
  sp.className = "wwr"; sp.setAttribute("data-tl", ""); sp.setAttribute("lang", DISP.lang); if(DISP.rtl) sp.setAttribute("dir", "rtl");
  sp.setAttribute("tabindex", "-1"); sp.textContent = b.dataset.showw || "";
  const had = document.activeElement === b;
  b.replaceWith("\u2009", sp); // a thin space: reading and written form never run together, in text too
  if(had) sp.focus();
  return sp;
}
if(PRON_FIRST) $("panel").addEventListener("click", e => {
  const b = e.target && e.target.closest ? e.target.closest("[data-showw]") : null;
  if(!b) return;
  e.preventDefault(); e.stopPropagation(); revealWritten(b);
}, true);

function highlightHTML(s, entry){
  return VC.highlightParts(s, entry, WORDS_BY_ID, PACK).map(x => x.hit ? `<b>${escapeHtml(x.text)}</b>` : escapeHtml(x.text)).join("");
}
// null when the sentence renders exactly as without characters (showPron off hides all ruby).
function sentenceRuby(s){
  if(!HAS_CHARACTERS || !s || !Array.isArray(s.ruby) || (!showPron() && !PRON_FIRST)) return null;
  return VC.rubyTiers(s, CHAR_LIST, prog, PACK, VC.charsStarted(PACK, WORDS, CHAR_LIST, prog, SU));
}
// The bare tier keeps its <rt> with visibility:hidden, so a token's width never changes
// across tiers and a line wraps the same either way.
const rubyTokHTML = (base, k) => k.tier === "bare"
  ? `<ruby class="bare">${base}<rt>${readingHTML(k.reading)}</rt></ruby>`
  : `<ruby>${base}<rt>${readingHTML(k.reading)}</rt></ruby>`;
// A malformed token (overlapping, out of range) renders as plain text.
function rubyTextHTML(s, toks, entry, taps){
  const t = String(s.t || ""); const hits = [];
  if(entry){ let o = 0; VC.highlightParts(s, entry, WORDS_BY_ID, PACK).forEach(x => { if(x.hit) hits.push([o, o + x.text.length]); o += x.text.length; }); }
  const inHit = (a, b) => hits.some(([h0, h1]) => a < h1 && b > h0);
  const plain = (a, b) => {
    const cuts = new Set([a, b]);
    hits.forEach(([h0, h1]) => { if(h0 > a && h0 < b) cuts.add(h0); if(h1 > a && h1 < b) cuts.add(h1); });
    const cs = [...cuts].sort((x, y) => x - y); let out = "";
    for(let k = 0; k < cs.length - 1; k++){ const seg = escapeHtml(t.slice(cs[k], cs[k+1])); out += inHit(cs[k], cs[k+1]) ? `<b>${seg}</b>` : seg; }
    return out;
  };
  let out = "", pos = 0;
  toks.forEach(k => {
    if(!(k.start >= pos && k.end > k.start && k.end <= t.length)) return;
    out += plain(pos, k.start);
    const base = escapeHtml(t.slice(k.start, k.end));
    const tw0 = taps ? WORDS_BY_ID[k.wordId] : null;
    const h = tw0 ? tokTapHTML(k.wordId, rubyTokHTML(base, k), phraseHead(t.slice(k.start, k.end), tw0, k.reading)) : rubyTokHTML(base, k);
    out += inHit(k.start, k.end) ? `<b>${h}</b>` : h;
    pos = k.end;
  });
  return out + plain(pos, t.length);
}
// false: the sentence could only show its reading line, where no blank can be placed.
function pfSentence(s, entry, blank, written, taps){
  if(!PRON_FIRST) return null;
  const d = VC.sentenceDisplay(s, CHAR_LIST, prog, PACK, VC.charsStarted(PACK, WORDS, CHAR_LIST, prog, SU), blank, written);
  if(d === null) return blank ? false : null;
  if(d.mode === "text") return null;
  if(d.mode === "pron") return { html: readingHTML(d.text), ruby: false, written: String(s.t || ""), taps: false };
  const hits = [];
  if(entry){ let o = 0; VC.highlightParts(s, entry, WORDS_BY_ID, PACK).forEach(x => { if(x.hit) hits.push([o, o + x.text.length]); o += x.text.length; }); }
  const inHit = (a, b) => hits.some(([h0, h1]) => a < h1 && b > h0);
  let ruby = false, anyPron = false, bl = null, tapped = false;
  const html = d.pieces.map(p => {
    let h;
    if(p.kind === "blank"){ bl = p; h = `<span class="blank">____</span>`; }
    else if(p.kind === "text") h = escapeHtml(p.text);
    else if(p.tier === "pron"){ anyPron = true; h = readingHTML(p.text); }
    else { ruby = true; h = rubyTokHTML(escapeHtml(p.text), showPron() ? p : Object.assign({}, p, { tier:"bare" })); }
    if(taps && p.kind === "tok" && WORDS_BY_ID[p.wordId]){ tapped = true; h = tokTapHTML(p.wordId, h, phraseHead(String(s.t || "").slice(p.start, p.end), WORDS_BY_ID[p.wordId], p.reading)); }
    if(p.kind !== "blank" && inHit(p.start, p.end)) h = `<b>${h}</b>`;
    return escapeHtml(p.pre) + h;
  }).join("");
  const t = String(s.t || "");
  return { html, ruby, written: anyPron ? (bl ? t.slice(0, bl.start) + "____" + t.slice(bl.end) : t) : false, taps: tapped };
}
const pfWrittenTap = pf => pf.written ? showWrittenBtn(pf.written) : "";
// A sentence whose tokens are word taps is not itself a tap target: it is heard from its own
// speaker button.
function sentenceRowHTML(s, entry, written){
  const pf = pfSentence(s, entry, null, written, true);
  if(pf && pf.taps) return `<div class="sent tks" data-tokbox><div class="st${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}${sentSayHTML(s)}${pfWrittenTap(pf)}</div><div class="se">${ui(s.en)}</div></div>`;
  if(pf) return `<div class="sent" data-sent="${SENT_INDEX.get(s)}"><div class="st${pf.ruby ? " hasruby" : ""}"${TA}>${pf.html}${pfWrittenTap(pf)}</div><div class="se">${ui(s.en)}</div></div>`;
  const rt = sentenceRuby(s);
  if(rt && rt.some(k => WORDS_BY_ID[k.wordId])) return `<div class="sent tks" data-tokbox><div class="st hasruby"${TA}>${rubyTextHTML(s, rt, entry, true)}${sentSayHTML(s)}</div><div class="se">${ui(s.en)}</div></div>`;
  if(rt) return `<div class="sent" data-sent="${SENT_INDEX.get(s)}"><div class="st hasruby"${TA}>${rubyTextHTML(s, rt, entry)}</div><div class="se">${ui(s.en)}</div></div>`;
  const p = pronOf(s);
  return `<div class="sent" data-sent="${SENT_INDEX.get(s)}"><div class="st"${TA}>${entry ? highlightHTML(s, entry) : escapeHtml(s.t)}</div>${p ? `<div class="sp">${readingHTML(p)}</div>` : ""}<div class="se">${ui(s.en)}</div></div>`;
}
function exampleSentencesHTML(entry){
  const ex = wordExampleSentences(entry, 2);
  if(!ex.length) return "";
  return `<p class="q" style="margin-top:12px">Example${ex.length>1?"s":""}:</p>${ex.map(s => sentenceRowHTML(s, entry)).join("")}`;
}
function revealBlock(entry){
  const p = pronBeside(entry), hear = canHearWord(entry);
  const icon = hear ? ` <span style="color:var(--mute);vertical-align:middle">${TEACH_PLAY_SVG}</span>` : "";
  return `<div${hear ? ` data-wid="${escapeHtml(entry.id)}" style="cursor:pointer"` : ""}><div class="rw"${TA}>${wordFormHTML(entry)}${icon}</div>${p ? `<div class="rp">${readingHTML(p)}</div>` : ""}<div style="color:var(--mute)">${glossOut(VC.gloss(entry), true)}</div></div>${exampleSentencesHTML(entry)}`;
}
const meaningChoices = entry => [VC.gloss(entry), ...VC.meaningOpts(entry, WORDS, wordMix()).map(d=>VC.gloss(d))];
// Plans skip unplayable words (hearableKinds, learnPair); this fallback covers a voice lost
// between planning and display, the one case the notice is for.
function hearItem(entry){
  if(!canHearWord(entry)) return Object.assign(readItem(entry), { needsNotice: true, reqKind: "hear" });
  return { kind:"mc", key:"w:"+entry.id, label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`,
    opts: meaningChoices(entry), a: VC.gloss(entry), optHtml: GLOSS_OPT, reveal: `<div class="q">You heard:</div>${revealBlock(entry)}`,
    onAnswer(ok){ markWord(entry.id, ok, "hear", this.reqKind); },
    mount: () => { const btn = $("sp"); sayWord(entry, btn); btn.onclick = ()=>sayWord(entry, btn); },
    };
}
// Built without Replay it still tries to play: a voice may have arrived since.
// words[].pronInGloss: a reading stimulus spells the meaning (docs/PACK_SCHEMA.md
// "pronInGloss"). Such a word is read from its written form alone, whatever its tier; while it
// still shows by its reading the read item is heard instead when a voice can say it, so a
// learner who has met no characters sees none.
const readStimHTML = entry => PRON_FIRST && entry.pronInGloss && entry.w ? `<div class="big wd"${TA}>${escapeHtml(entry.w)}</div>` : bigWordHTML(entry);
function readItem(entry){
  const hear = canHearWord(entry);
  if(hear && pronLeakShown(entry)) return Object.assign(hearItem(entry), { reqKind: "read" });
  return { kind:"mc", key:"w:"+entry.id, label:"What does it mean?", optsClass:"opts-hero",
    html: readStimHTML(entry) + (hear ? REPLAY_STAGE : ""), opts: meaningChoices(entry), a: VC.gloss(entry), optHtml: GLOSS_OPT, reveal: revealBlock(entry),
    onAnswer(ok){ markWord(entry.id, ok, "read", this.reqKind); }, mount: () => { const b = hear ? $("rpa") : null; sayWord(entry, b || undefined); if(b) b.onclick = () => sayWord(entry, b); }, };
}
// words[].pronInGloss (docs/PACK_SCHEMA.md "pronInGloss"): the gloss spells the reading, so the
// meaning stimulus never asks for it: a word still shown by its reading gets the read item, a
// written one its options without readings.
function recallItem(entry){
  if(pronLeakShown(entry)) return readItem(entry);
  const ds = VC.wordOpts(entry, WORDS, PRON_FIRST ? (e => dispWord(e).text) : null, PACK, optLike(entry), wordMix()); // same word class as the answer; pronFirst: distinct displayed labels, no homophones
  // Keyed by word id so two options can never collapse into one key, whatever they display as.
  const byId = {}; [entry, ...ds].forEach(e=>{ byId[e.id] = e; }); const mode = optScript(entry, ds);
  return { kind:"mc", key:"w:"+entry.id, label:"Which word is this?", optsClass:"opts-hero opts-w",
    html: `<div class="med" style="text-align:center">${glossOut(VC.gloss(entry))}</div>`,
    opts: [entry.id, ...ds.map(d=>d.id)], a: entry.id, optHtml: wordOptHtml(byId, o => byId[o].w, !!entry.pronInGloss, mode), optsT: true, reveal: revealBlock(entry),
    onAnswer(ok){ markWord(entry.id, ok, "recall", this.reqKind); }, onReveal: b => sayWord(entry, b), revealHear: canHearWord(entry) };
}
// words[].typedSyn (docs/PACK_SCHEMA.md "Synonyms"): on a meaning stimulus another word's
// whole gloss also fits, typing that word is right too and the reveal names it. fit(word, val);
// show(word) labels the match. A pack without typedSyn checks fit(entry) alone.
function synTyped(entry, fit, show){
  const hit = val => fit(entry, val) ? null : VC.typedSynHit(entry, WORDS_BY_ID, s => fit(s, val));
  return { check: val => fit(entry, val) || !!hit(val),
    note: val => { const s = hit(val); return s ? `<div class="diff">also right: ${show(s)} · ${glossShort(VC.gloss(s), 1, 0)}</div>` : ""; } };
}
function typeItem(entry){
  const syn = synTyped(entry, (e, val) => VC.acceptTyped(val, e, PACK, VC.affixAlts(e.w), WORDS), e => `<bdi${TA}>${escapeHtml(e.w)}</bdi>`);
  return { kind:"type", key:"w:"+entry.id, label:"Type the word",
    html: `<div class="med" style="text-align:center">${glossOut(VC.gloss(entry))}</div>`,
    check: syn.check, feedback: syn.note, reveal: revealBlock(entry),
    onAnswer(ok){ markWord(entry.id, ok, "type", this.reqKind); }, onReveal: b => sayWord(entry, b), revealHear: canHearWord(entry),
    choiceFallback: () => typedRecallFallback(entry) };
}
// A pass leaves k alone: seeing the answer among the options does not show the word can be
// produced.
const typedFallbackKind = ok => ok ? "recall" : "type";
function typedRecallFallback(entry){
  return Object.assign(recallItem(entry), { onAnswer(ok){ markWord(entry.id, ok, typedFallbackKind(ok)); } });
}
// pack.typing "pron": the production slot alternates reading and written typed items (VC.typeSlotKind),
// each tagged on the card so the learner never confuses them. The reading item is silent:
// audio would give the reading away. The written item needs the written form on display
// (pronFirst: a word still shown by its reading gets the reading item in both slots).
const PRON_NOUN = TONES ? PACK.tones : "reading";
const LATIN_PRON = /\p{Script=Latin}/u; // a Latin-script reading gets a Latin input; any other (e.g. kana) the target-language one
const kindTag = (tag, sub) => `<div class="ktag"${UIA}><b>${escapeHtml(tag)}</b>${sub ? ` · ${escapeHtml(sub)}` : ""}</div>`;
const pronFeedback = entry => val => { const v = VC.checkPronTyped(val, entry.pron, PACK); return v === "tones" || v === "tonesDiff" ? `<div class="diff">tones: <span class="tpron">${readingHTML(entry.pron)}</span></div>` : ""; };
function pronTypeItem(entry){
  const syn = synTyped(entry, (e, val) => !!e.pron && VC.checkPronTyped(val, e.pron, PACK) !== "wrong", e => `<span class="tpron">${readingHTML(e.pron)}</span>`), tones = pronFeedback(entry);
  return { kind:"type", key:"w:"+entry.id, label:`Type the ${PRON_NOUN}`,
    html: `${kindTag(PRON_NOUN, TONES ? "tones optional" : "")}<div class="med" style="text-align:center">${glossOut(VC.gloss(entry))}</div>`,
    placeholder: TONES ? `${PRON_NOUN}, tones optional…` : `${PRON_NOUN}…`, inputTA: LATIN_PRON.test(entry.pron) ? ' lang="en"' : undefined,
    check: syn.check,
    feedback: val => tones(val) + syn.note(val),
    reveal: revealBlock(entry), onAnswer(ok){ markWord(entry.id, ok, "type", this.reqKind); }, onReveal: b => sayWord(entry, b), revealHear: canHearWord(entry),
    choiceFallback: () => typedRecallFallback(entry) };
}
function writtenTypeItem(entry){
  const hear = canHearWord(entry);
  // No-tones pron packs (ja) only: half-width kana and either affix tilde match the written
  // form (VC.writtenTypedFold). Latin and tones packs are untouched.
  const foldTyped = !TONES && !LATIN_PRON.test(entry.pron || "") ? VC.writtenTypedFold : (v => v);
  const syn = synTyped(entry, (e, val) => VC.acceptTyped(foldTyped(val), e, PACK, VC.affixAlts(e.w), WORDS), e => `<bdi${TA}>${escapeHtml(e.w)}</bdi>`);
  return { kind:"type", key:"w:"+entry.id, label:"Type the characters",
    html: `${kindTag("characters", hear ? "listen" : "")}<div class="med" style="text-align:center">${glossOut(VC.gloss(entry))}</div>${hear ? `<div class="listen-stage"><button class="replay" id="rp2" aria-label="Replay">${REPLAY_SVG}</button></div>` : ""}`,
    placeholder: "characters…",
    mount: () => { if(hear){ const b = $("rp2"); sayWord(entry, b); b.onclick = () => sayWord(entry, b); } },
    // A synonym's characters (typedSyn) are right for the word, but the learner did not write this
    // word's characters: no unit moves and no c: answer is logged (review 2026-10-02).
    check(val){ const ok = syn.check(val); this.synHit = ok && !VC.acceptTyped(foldTyped(val), entry, PACK, VC.affixAlts(entry.w), WORDS); return ok; }, feedback: syn.note, reveal: revealBlock(entry),
    onAnswer(ok){ markWord(entry.id, ok, "type", this.reqKind); if(this.synHit) this.cueUnit = null; else markUnitTyped(this, entry.id, ok); }, onReveal: b => sayWord(entry, b), revealHear: canHearWord(entry),
    choiceFallback: () => typedRecallFallback(entry) };
}
function pronSlotItem(entry, slot){
  const shown = !!entry.w && !dispWord(entry).isPron;
  if(shown && (slot === "written" || !entry.pron)) return writtenTypeItem(entry);

function passageRubyHTML(t, toks, a, b){
  let out = "", pos = a;
  toks.forEach(k => {
    if(!(k.start >= pos && k.end > k.start && k.end <= b)) return;
    out += escapeHtml(t.slice(pos, k.start));
    const base = escapeHtml(t.slice(k.start, k.end));
    out += rubyTokHTML(base, k);
    pos = k.end;
  });
  return out + escapeHtml(t.slice(pos, b));

// No character is ever dropped or given a guessed reading (VC.composeSpanReading). Text
// outside every token (a name with no word) stays as written: there is no reading for it.
function pfPassage(s, seg, taps){
  if(!PRON_FIRST) return null;
  const t = String(s.t || "");
  const rt = sentenceRuby(s);
  let toks = rt;
  const cuts = []; let at = 0;
  seg.parts.forEach(x => { cuts.push(at); at += x.text.length; });
  if(!toks){
    toks = []; at = 0;
    seg.parts.forEach(x => {
      const a = at; at += x.text.length;
      const w = x.id ? WORDS_BY_ID[x.id] : null; if(!w) return;
      const d = dispWord(w);
      if(!d.isPron || x.text === w.w){ toks.push({ start: a, end: at, tier: d.isPron ? "pron" : "plain", reading: w.pron || "", wordId: w.id }); return; }
      VC.composeSpanReading(x.text, w, charReading, PACK).forEach(q => { if(q.reading) toks.push({ start: a + q.start, end: a + q.end, tier: "pron", reading: q.reading, wordId: w.id }); });
    });
  }
  const pieces = VC.sentencePieces(s, toks, null, cuts);
  let ruby = false;
  const pieceHTML = p => {
    if(p.kind === "tok" && (p.tier === "ruby" || p.tier === "bare")){ ruby = true; return rubyTokHTML(escapeHtml(p.text), showPron() ? p : Object.assign({}, p, { tier:"bare" })); }
    return p.kind === "tok" && p.tier === "pron" ? readingHTML(p.text) : escapeHtml(p.text);
  };
  let html = ""; at = 0;
  seg.parts.forEach(x => {
    const a = at; at += x.text.length;
    const mine = pieces.filter(p => p.start >= a && p.start < at);
    if(!mine.length) return;
    const inner = mine.map((p, i) => (i ? escapeHtml(p.pre) : "") + pieceHTML(p)).join("");
    const w = x.id ? WORDS_BY_ID[x.id] : null;
    const head = w && taps ? spanHead(x.text, w, rt, a) : null;
    const hd = head ? ` data-ts="${escapeHtml(head.surface)}" data-tr="${escapeHtml(head.reading)}"` : "";
    html += escapeHtml(mine[0].pre) + (w && taps === "pw" ? `<span class="pw" data-pw="${escapeHtml(x.id)}"${x.gloss ? ` data-pg="${escapeHtml(x.gloss)}"` : ""}${hd} role="button" tabindex="0">${inner}</span>`
      : w && taps === "tok" ? tokTapHTML(w.id, inner, head) : inner);
  });
  return { html, ruby };
}
function spanHead(text, w, rt, a){
  if(!phraseHead(text, w, "")) return null;
  if(!rt) return { surface: text, reading: VC.spanReadingText(text, w, charReading, PACK) };
  let r = "", pos = 0;
  rt.filter(k => k.start >= a && k.end <= a + text.length).forEach(k => {
    if(k.start - a > pos) r += text.slice(pos, k.start - a);
    r = VC.joinReadings(r, String(k.reading || ""), PACK); pos = k.end - a;
  });
  return { surface: text, reading: r + text.slice(pos) };
}
function passagePlainHTML(s){

}

function pfRubyText(t, ruby){

  const obj = { t: String(t == null ? "" : t), ruby };
  const toks = VC.rubyTiers(obj, CHAR_LIST, prog, PACK, VC.charsStarted(PACK, WORDS, CHAR_LIST, prog, SU));
  if(!toks) return null;

    if(p.kind === "tok"){ hasRuby = true; return escapeHtml(p.pre) + rubyTokHTML(escapeHtml(p.text), showPron() ? p : Object.assign({}, p, { tier:"bare" })); }
    return escapeHtml(p.pre) + escapeHtml(p.text);

    const hp = r && showPron() ? r : "";
    return `<span class="gw"${TA}>${escapeHtml(head.surface)}</span>${hp ? ` <span class="gp"${LTR}>${readingHTML(hp)}</span>` : ""}${ge}`;

// The container's innerHTML is replaced on every render, so listeners never accumulate.
function wirePassage(box, glossEl){
  const tap = t => {
    const id = t.dataset.pw;
    if(RD && RD.tapped.indexOf(id) < 0) RD.tapped.push(id);
    if(helpCur && helpCur.el !== glossEl) helpShut();
    box.querySelectorAll(".pw.on").forEach(x => x.classList.remove("on"));
    t.classList.add("on");
    // So the results screen's weak-word list shows the sense the learner actually looked at.
    const g = t.dataset.pg || "";
    if(RD && RD.glosses){ if(g) RD.glosses[id] = g; else delete RD.glosses[id]; }
    const head = tokHeadOf(t);
    if(glossEl){ glossEl.innerHTML = glossHTML(id, g, head, true) + HELP_X; glossEl.hidden = false; helpOpen(glossEl, HELP_MS, () => { glossEl.hidden = true; box.querySelectorAll(".pw.on").forEach(x => x.classList.remove("on")); }); }
    announce(glossHTML(id, g, head));
  };
  box.addEventListener("click", e => {
    const w = e.target.closest("[data-pw]"); if(w){ tap(w); return; }
    const b = e.target.closest("[data-say]"); if(b){ const s = RD && RD.p.sentences[+b.dataset.say]; if(s) saySentence(s, b); }
  });
  box.addEventListener("keydown", e => { const w = e.target.closest && e.target.closest("[data-pw]"); if(w && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); tap(w); } });
}

function placementItemTotal(){ return VC.strata(WORDS, PACK.placement, SIZE).reduce((n,_,i)=>n+VC.placementItemCount(i, PACK), 0); }
function placeRender(){

function startPlacement(){

  const bucketItems = [];
  st.forEach((b,bi) => { pick(b.words, VC.placementItemCount(bi, PACK)).forEach(w=>bucketItems.push({b:bi, w})); });
  PL = { vocab:{items:shuffle(bucketItems), i:0}, st, res: st.map(()=>({r:0,n:0})) };

function placeVocabNext(){
  stopSpeaking();

  if(V.i >= V.items.length){ placeResult(); return; }
  const it = V.items[V.i++]; const w = it.w; setScore(V.i - 1, V.items.length);
  const opts = shuffle([VC.gloss(w), ...VC.meaningOpts(w, WORDS).map(d => VC.gloss(d))]); // a measurement: level tiers, never optsMix (review M1)
  const asHear = canHearWord(w) && Math.random() < 0.5;
  P.innerHTML = `<p class="q">Words ${V.i} / ${V.items.length}</p>
    ${asHear ? `<div class="hear-stage"><button class="speaker" id="rp" aria-label="Replay">${SPEAKER_SVG}</button></div>` : readStimHTML(w)}
    <div class="opts" id="o"></div>`;
  if(asHear){ const btn = $("rp"); sayWord(w, btn); btn.onclick = ()=>sayWord(w, btn); }
  opts.forEach(o => {
    const b = document.createElement("button"); b.innerHTML = glossOut(o);
    b.onclick = () => { PL.res[it.b].n++; if(o===VC.gloss(w)) PL.res[it.b].r++; placeVocabNext(); };
    $("o").appendChild(b);
  });
}

  const nn = nextNewSet();
  const pos = nn ? `${levelLabel(nn.lv)}, set ${nn.set+1}` : "everything covered";
  const P = $("panel");
  P.innerHTML = `<div class="done"><h2>Start at ${escapeHtml(pos)}</h2>
    <table class="stats">${st.map((b,i)=>{ const r = PL.res[i]; return `<tr><td>${escapeHtml(levelLabel(b.lv))} sets ${b.s0+1}–${b.s1}</td><td style="color:${i<passed?'var(--ok)':'var(--bad)'}">${r.r}/${r.n}</td></tr>`; }).join("")}</table>
    <p class="q">${learnedWords().length} words learned; newly placed ones are provisional and kept in review.</p>
    <button class="next" id="ok">Go to Today</button></div>`;
  $("ok").onclick = () => { switchToTab("today", "Today"); testSel = null; render(); };
}

function progressRender(){
  stopSpeaking();
  setScore(0,0);
  const P = $("panel");
  const lwAll = learnedWords();
  const availSent = availableSentences();
  const rows = LEVELS.map(lv => {
    const list = levelList(lv); const learnedList = lwAll.filter(w=>w.lv===lv);
    const masteredN = learnedList.filter(w=>mastered(w.id)).length;
    const sentLv = SENTENCES.filter(s=>s.lv===lv); const sentAvailLv = availSent.filter(s=>s.lv===lv);
    const sentMasteredN = sentAvailLv.filter(s=>sentenceMastered(s.id)).length;
    const L = escapeHtml(levelLabel(lv));
    return `<tr><td>${L}</td><td>${learnedList.length} / ${list.length} learned · ${masteredN} mastered</td></tr>
      ${sentLv.length ? `<tr><td>${L} sentences</td><td>${sentAvailLv.length} / ${sentLv.length} available · ${sentMasteredN} mastered</td></tr>` : ""}`;
  }).join("");
  const weak = weakFirst(lwAll.filter(w=>VC.weakScore(prog.w[w.id])>0), 10);
  const cp = HAS_CHARACTERS ? charProgress() : null;
  const xp = HAS_SCRIPT ? scriptProgress() : null;
  P.innerHTML = `${hasSpeech || PACK_AUDIO ? "" : `<div class="warn">No text-to-speech voice is available in this browser, so listening and audio-replay features show the word instead of playing sound.</div>`}
    <table class="stats">${xp ? xp.rows : ""}${rows}${cp ? cp.rows : ""}
      ${HAS_PASSAGES ? VC.readingStats(PASSAGE_LIST, PACK, prog).map(r => `<tr><td>${escapeHtml(levelLabel(r.lv))} reading</td><td>${r.done} / ${r.total} passages${r.avg != null ? ` · avg ${r.avg}%` : ""}</td></tr>`).join("") : ""}
      ${HAS_LESSONS ? `<tr><td>Sounds</td><td>${LESSON_LIST.filter(l=>prog.lessons[l.id]).length} / ${LESSON_LIST.length} lessons done</td></tr>` : ""}
      <tr><td>Sessions</td><td>${prog.sessions||0}</td></tr></table>
    ${PACK.showPron !== false ? `<div class="row" style="margin-top:14px"><button class="chip ${showPron()?'on':''}" id="togglePron" aria-pressed="${showPron()}">Show pronunciation</button></div>` : ""}${PAUSE_NEW ? `<div class="row" style="margin-top:14px"><button class="chip ${paused() ? "" : "on"}" id="togglePause" aria-pressed="${!paused()}">New material: ${paused() ? "paused" : "on"}</button></div>` : ""}${xp ? xp.controls : ""}${cp ? cp.controls : ""}
    <p class="q" style="margin-top:14px">${weak.length ? "Weakest words" : "No weak words yet — nice."}</p>
    ${weak.map(w=>`<div class="rowset">${wordRowHTML(w, "rowset")}</div>`).join("")}
    <div class="row" style="margin-top:16px">
      <button class="ghost" id="exp" style="flex:1">Export progress</button>
      <button class="ghost" id="imp" style="flex:1">Import progress</button>
    </div>
    <div id="impbox" style="display:none;margin-top:10px">
      <textarea id="imptxt" placeholder="Paste exported JSON here"></textarea>
      <input type="file" id="impfile" accept="application/json" style="margin-top:8px">
      <button class="next" id="doimport">Load</button>
      <div id="impErr" class="warn" style="display:none;margin-top:8px"></div>${HAS_LEGACY ? `
      <div id="impSum" class="stmt" style="display:none;margin-top:8px"></div>` : ""}
    </div>
    <button class="ghost" id="reset" style="margin-top:16px;color:var(--bad);border-color:var(--bad)">Reset all progress</button>`;
  if(PACK.showPron !== false) $("togglePron").onclick = () => { prog.showPron = !showPron(); store.save(); progressRender(); };
  if(PAUSE_NEW) $("togglePause").onclick = () => { VC.setPause(prog, !paused()); store.save(); progressRender(); };
  if(xp) xp.wire();
  if(cp) cp.wire();
  $("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(prog, null, 1)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `${STORE_KEY}_progress.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  $("imp").onclick = () => { const b = $("impbox"), open = b.style.display === "none"; b.style.display = open ? "block" : "none"; if(open) bringIntoView(b); };
  $("impfile").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { $("imptxt").value = r.result; }; r.readAsText(f); };
  const showImportError = msg => { const el = $("impErr"); el.textContent = msg; el.style.display = "block"; bringIntoView(el); };
  // Backup first; if it can't be written the import is not applied, so progress is never lost unbacked.
  const applyImported = async next => {
    if(!(await store.backup("pre_import_backup", JSON.stringify(prog)))){ showImportError("Import not applied: the current progress couldn't be backed up first (storage unavailable)."); return; }
    prog = next; sessStore.clear();
    store.save(); applyTheme(); progressRender();
  };
  $("doimport").onclick = async () => {
    try{
      const text = $("imptxt").value;
      const parsed = HAS_LEGACY ? VC.parseStored(text) : null;
      if(parsed && parsed.ok && VC.isLegacyRecord(PACK, LEGACY_MAP, parsed.data)){
        const m = VC.migrateLegacy(PACK, LEGACY_MAP, parsed.data);
        if(!m.ok){ showImportError("That looks like progress from the older app, but it could not be converted: " + m.reason); return; }
        if(parsed.data.theme === undefined) m.prog.theme = prog.theme;
        if(prog.showPron !== undefined) m.prog.showPron = prog.showPron;
        if(m.prog.chars && prog.chars && parsed.data.mixChars === undefined) m.prog.chars.mix = prog.chars.mix !== false;
        $("impErr").style.display = "none";
        const box = $("impSum");
        box.innerHTML = `${legacySummaryHTML(m, "the file you imported")}<button class="next" id="impApply" style="margin-top:8px">Import this progress</button><button class="ghost" id="impCancel" style="margin-top:8px">Cancel</button>`;
        box.style.display = "block"; bringIntoView(box);
        $("impApply").onclick = () => applyImported(m.prog);
        $("impCancel").onclick = () => { box.style.display = "none"; box.innerHTML = ""; };
        return;
      }
      const r = VC.applyImport(prog, text, PACK);
      if(!r.ok){ showImportError("That doesn't look like valid exported progress for this pack: " + r.reason); return; }
      await applyImported(r.prog);
    }catch(e){
      showImportError("That doesn't look like valid exported progress: " + (e && e.message ? e.message : "could not be read"));
    }
  };
  $("reset").onclick = async () => {
    if(!confirm(`Reset all progress? A copy is kept under ${STORE_KEY}_reset_backup until the next reset.`)) return;
    if(!(await store.backup("reset_backup", JSON.stringify(prog)))){ alert("Reset cancelled: the current progress couldn't be backed up first (storage unavailable)."); return; }
    // The legacy key and its backup (pack.legacy) are never touched.
    prog = Object.assign(VC.defaultProg(PACK), { theme: prog.theme, showPron: prog.showPron }); sessStore.clear();
    store.save(); progressRender();
  };
}
function charProgress(){
  const stages = VC.stagePath(PACK, WORDS, CHAR_LIST, prog, SU).filter(s => s.kind === "chars");
  const recs = VC.charRecs(prog);
  const streak = u => ((recs[u.id] || {}).s || 0);
  const unlocked = VC.charsUnlocked(PACK, WORDS, prog), started = VC.charsStarted(PACK, WORDS, CHAR_LIST, prog, SU);
  // characters.learn "lag": no stages, one line (taught of ready, ready = the word is learned).
  const lag = () => { const lw = new Set(learnedWords().map(w => w.id)), rec = CHAR_LIST.filter(u => recs[u.id]);
    const ready = CHAR_LIST.filter(u => recs[u.id] || lw.has(u.words[0])).length;
    return `<tr><td>${tf(CHAR_CFG.label)}</td><td>${rec.length} / ${ready} taught · ${CHAR_LIST.length} in all · ${rec.filter(u => VC.charTier(streak(u), PACK) !== "pron").length} mastered · ${rec.filter(u => VC.charTier(streak(u), PACK) === "bare").length} bare</td></tr>`; };
  const rows = !started ? "" : CHAR_CFG.learn === "lag" ? lag() : stages.map(st => {
    const list = VC.charStageUnits(st.levels, CHAR_LIST, PACK);
    const taught = VC.charSets(st.levels, CHAR_LIST, PACK).filter(set => VC.charSetTaught(set, prog)).reduce((n, set) => n + set.length, 0);
    const masteredN = list.filter(u => recs[u.id] && VC.charTier(streak(u), PACK) !== "pron").length;
    const bareN = list.filter(u => recs[u.id] && VC.charTier(streak(u), PACK) === "bare").length;
    return `<tr><td>${tf(st.label)}</td><td>${taught} / ${list.length} taught · ${st.recorded} recorded · ${masteredN} mastered · ${bareN} bare</td></tr>`;
  }).join("");
  const defer = !!(prog.chars && prog.chars.defer === true), order = VC.charOrder(PACK, prog);
  const deferred = VC.charStages(PACK, Object.assign({}, prog, { chars: Object.assign({}, prog.chars, { defer: true }) }));
  const top = deferred.length ? levelLabel(deferred[0].after) : "";
  const mix = !!(prog.chars && prog.chars.mix !== false);
  const showMix = started; // mixing changes nothing until characters have started
  const controls = (unlocked || showMix) ? `<div id="charCtl" style="margin-top:14px">${pathStrip()}
    ${showMix ? `<div class="row"><button class="chip ${mix ? "on" : ""}" id="toggleMix" aria-pressed="${mix}">Mix known characters into sentences</button></div>` : ""}
    ${unlocked && CHAR_CFG.withWords ? `<div class="row">${[["ordFirst", "first", "Characters: first"], ["ordBefore", "with", "Characters: with words"], ["ordAfter", "later", "Characters: later"]].map(([id, m, t]) => `<button class="chip ${order === m ? "on" : ""}" id="${id}" aria-pressed="${order === m}">${t}</button>`).join("")}</div>
    <p class="q" style="margin-top:6px">Changes what Today's Learn step teaches next. Nothing you've learned is lost.</p>` : unlocked ? `<div class="row"><button class="chip ${defer ? "" : "on"}" id="ordBefore" aria-pressed="${!defer}">${CHAR_CFG.withWords ? "Characters: with words" : `Characters before ${escapeHtml(top)}`}</button><button class="chip ${defer ? "on" : ""}" id="ordAfter" aria-pressed="${defer}">${CHAR_CFG.withWords ? "Characters: later" : `Characters after ${escapeHtml(top)}`}</button></div>
    <p class="q" style="margin-top:6px">Changes what Today's Learn step teaches next. Nothing you've learned is lost.</p>` : ""}</div>` : "";
  const wire = () => {
    if(showMix) $("toggleMix").onclick = () => { VC.ensureChars(prog).mix = !mix; store.save(); progressRender(); };
    if(unlocked && CHAR_CFG.withWords) [["ordFirst", "first"], ["ordBefore", "with"], ["ordAfter", "later"]].forEach(([id, m]) => { $(id).onclick = () => { VC.setCharMode(prog, m); store.save(); progressRender(); }; });
    else if(unlocked){
      $("ordBefore").onclick = () => { VC.setCharOrder(prog, false); store.save(); progressRender(); };
      $("ordAfter").onclick = () => { VC.setCharOrder(prog, true); store.save(); progressRender(); };
    }
  };
  return { rows, controls, wire };
}
function scriptProgress(){
  const recs = VC.scriptRecs(prog);
  const isM = u => !!recs[u.id] && VC.scriptMastered(recs[u.id], PACK);
  let rows = SCFG.stages.map(st => {
    const list = VC.scriptStageUnits(st.key, SUNITS);
    const taught = VC.scriptSets(st.key, SUNITS).filter(set => VC.scriptSetTaught(set, prog)).reduce((n, set) => n + set.length, 0);
    return `<tr><td>${tf(st.label)}</td><td>${taught} / ${list.length} taught · ${list.filter(isM).length} mastered</td></tr>`;
  }).join("");
  if(SUNITS.every(isM)) rows += `<tr id="xMastered"><td colspan="2">Script mastered</td></tr>`;
  const off = VC.scriptSkipped(prog);
  const stageOn = st => !(prog.script && prog.script.skip && prog.script.skip[st.key] === true);
  const multi = SCFG.stages.length > 1;
  const controls = `<div id="scriptCtl" style="margin-top:14px"><div class="row"><button class="chip ${off ? "" : "on"}" id="xOn" aria-pressed="${!off}">Script primer on</button><button class="chip ${off ? "on" : ""}" id="xOff" aria-pressed="${off}">Script primer off</button></div>
    ${multi && !off ? `<div class="row">${SCFG.stages.map((st, i) => `<button class="chip ${stageOn(st) ? "on" : ""}" id="xSt${i}" aria-pressed="${stageOn(st)}">${tf(st.label)}</button>`).join("")}</div>` : ""}
    <p class="q" style="margin-top:6px">Changes what Today's Learn step teaches next. Nothing you've learned is lost.</p></div>`;
  const wire = () => {
    $("xOn").onclick = () => { VC.setScriptSkipped(prog, false); store.save(); progressRender(); };
    $("xOff").onclick = () => { VC.setScriptSkipped(prog, true); store.save(); progressRender(); };
    if(multi && !off) SCFG.stages.forEach((st, i) => { $("xSt" + i).onclick = () => { VC.setScriptSkipped(prog, stageOn(st), st.key); store.save(); progressRender(); }; });
  };
  return { rows, controls, wire };
}
function legacySummaryHTML(m, kept){
  const p = m.prog, n = o => Object.keys(o || {}).length;
  const setsN = Object.values(p.sets || {}).reduce((a, b) => a + (b || 0), 0);
  const parts = [`${n(p.w)} word records`, `${n(p.s)} sentence records`];
  if(p.chars) parts.push(`${n(p.chars.c)} ${tf(CHAR_CFG ? CHAR_CFG.label : "")} records`);
  parts.push(`${setsN} sets done`, `${p.sessions || 0} sessions`);
  const LIST_MAX = 20;
  const um = m.unmapped || [];
  const umHTML = um.length ? `<p class="q" style="margin:8px 0 4px">${um.length} part${um.length > 1 ? "s" : ""} of the old record ${um.length > 1 ? "have" : "has"} no place here and ${um.length > 1 ? "were" : "was"} not brought over (kept in ${escapeHtml(kept)}):</p><ul id="legacyUnmapped" style="margin:0;padding-left:20px;font-size:14px">${um.slice(0, LIST_MAX).map(u => `<li><bdi>${escapeHtml(u.path)}</bdi>: ${escapeHtml(u.reason)}</li>`).join("")}${um.length > LIST_MAX ? `<li>and ${um.length - LIST_MAX} more</li>` : ""}</ul>` : "";
  const dr = (m.dropped || []).map(d => d.path);
  const drHTML = dr.length ? `<p class="q" style="margin:8px 0 0">Settings this app doesn't have, left out: ${escapeHtml(dr.join(", "))}.</p>` : "";
  return `<div>Progress from the older app: ${parts.join(", ")}.</div>${umHTML}${drHTML}`;
}

function applyTheme(){ document.documentElement.setAttribute("data-theme", prog.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); }
$("themebtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  prog.theme = cur === "dark" ? "light" : "dark";
  applyTheme(); store.save();
};

// The legacy key itself is only read; the first backup is never overwritten.
async function legacyBootMigration(){
  const old = await store.getRaw(PACK.legacy.key);
  if(!old.ok) return { fail: "it could not be read (storage error)" };
  if(old.value == null || old.value === "") return null;
  const m = VC.migrateLegacy(PACK, LEGACY_MAP, old.value);
  if(!m.ok){ console.warn(`${PACK.legacy.key}: not migrated (${m.reason})`); return { fail: `it could not be converted (${m.reason})` }; }
  const bk = VC.legacyBackupKey(PACK);
  const had = await store.getRaw(bk);
  if(!had.ok) return { fail: `its safety copy (${bk}) could not be checked (storage error)` };
  if((had.value == null || had.value === "") && !(await store.setRaw(bk, String(old.value)))) return { fail: `its safety copy (${bk}) could not be saved (storage error)` };
  if(m.unmapped.length) console.warn(`${PACK.legacy.key}: ${m.unmapped.length} unmapped part(s), kept in ${bk}`, m.unmapped);
  return { m };
}
// This session saves nothing, so this pack's key stays empty and the next boot retries the
// import. "Start without it" lifts that (the old record stays untouched).
function legacyFailHTML(why){
  return `<div>Progress from the older app was found but not imported: ${escapeHtml(why)}. It is left untouched, and nothing you do now is saved, so the import runs again the next time this page loads. Reload to try again, or start without it.</div>`;
}
(async function(){
  const got = await store.load();
  if(got.ok) sessProgFp = sessBootFp = VC.sessionHash(got.value == null ? "" : got.value);
  // Only when this pack's own key read fine and holds nothing.
  const lm = (HAS_LEGACY && got.ok && (got.value == null || got.value === "")) ? await legacyBootMigration() : null;
  const mig = lm && lm.m;
  if(mig){
    prog = mig.prog;
    applyTheme();
    await store.save();
    legacyNotice = legacySummaryHTML(mig, VC.legacyBackupKey(PACK));
    booted = true;
    render();
    return;
  }
  if(lm && lm.fail){
    storeReadOnly = true;
    legacyFail = lm.fail;
  }
  const b = VC.bootProg(got.value, PACK, !got.ok);
  if(b.readOnly){
    storeReadOnly = true;
    storageWarn("Saved progress could not be read (storage error), so this session is read-only: nothing you do now will be saved, and your stored progress is left untouched. Reload to try again.");
  }
  if(b.backupRaw !== null){ console.warn(`${STORE_KEY}: stored progress unusable (${b.reason}); kept as ${STORE_KEY}_invalid_backup`); await store.backup("invalid_backup", b.backupRaw); }
  if(b.dropped.length) console.warn(`${STORE_KEY}: dropped progress for unknown levels: ${b.dropped.join(", ")}`);
  prog = b.prog;
  applyTheme();
  booted = true;
  sessionLoad();
  if(storeReadOnly || !sessionBoot()) render();
})();

// build.sh writes sw.js next to the built page. Registration is a no-op on file:// and
// harmlessly fails in dev mode over http (no sw.js). On a first visit (no controller yet) the
// worker taking control is not an update. Registered after window load, so a first visit's
// install (which fetches the page again to precache it) never competes with boot.
(function(){
  if(typeof navigator === "undefined" || !navigator.serviceWorker) return;
  if(typeof location === "undefined" || !/^https?:$/.test(location.protocol)) return;
  const sw = navigator.serviceWorker;
  const wasControlled = !!sw.controller;
  sw.addEventListener("controllerchange", () => {
    if(!wasControlled || $("swtoast")) return;
    const t = document.createElement("button");
    t.id = "swtoast"; t.className = "swtoast"; t.textContent = "Updated, reload for the new version";
    t.onclick = () => location.reload();
    document.body.appendChild(t);
  });
  const reg = () => { sw.register("sw.js").catch(() => {}); };
  if(document.readyState === "complete") reg(); else window.addEventListener("load", reg);
})();
</script>
